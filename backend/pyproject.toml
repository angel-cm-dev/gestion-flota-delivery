[project]
name = "gestion-flota-delivery-api"
version = "1.0.0"
description = "API de gestión de flota y delivery (FastAPI + SQLAlchemy 2 + PostgreSQL)"
authors = [{ name = "Angel Castañeda Meza" }]
license = { text = "MIT" }
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # Depends()/Query() en parámetros por defecto es el patrón de FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
