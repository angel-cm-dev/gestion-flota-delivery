server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Fotos de prueba de entrega: hasta 5 MB (+ margen del multipart).
  client_max_body_size 6m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # El navegador habla solo con nginx; nginx reenvía la API al backend (sin CORS).
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://backend:8000/health;
  }

  # Archivos con hash en el nombre: caché larga.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: cualquier otra ruta la resuelve React Router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
